name: Test custom dangerfile path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify fixture Dangerfile exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/Dangerfile.swift" ]; then
            echo "FAIL: fixture Dangerfile missing"
            exit 1
          fi
          echo "PASS: fixture present"
      # Danger needs a pull_request context and repo-scoped GitHub API access;
      # under the harness (workflow_dispatch + sentinel repository) it may
      # either skip gracefully (success) or fail on the API call.
      - id: action
        uses: .
        continue-on-error: true
        with:
          dangerfile: tests/fixtures/Dangerfile.swift
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: danger-swift ran successfully with custom Dangerfile"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (no PR context / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test basic usage (default Dangerfile)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify default Dangerfile exists at repo root
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/Dangerfile.swift" ]; then
            echo "FAIL: Dangerfile.swift not found at repo root"
            exit 1
          fi
          echo "PASS: Dangerfile.swift present"
      # Danger needs a pull_request event context and repo-scoped GitHub API
      # access; under the harness the event is workflow_dispatch and
      # GITHUB_REPOSITORY is a sentinel, so danger may skip or fail.
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed gracefully (no PR context / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
